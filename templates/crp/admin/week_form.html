<form method="post" class="row g-3">{% csrf_token %}<input type="hidden" name="action" value="week_save">{% if editing_week %}<input type="hidden" name="week_id" value="{{ editing_week.id }}">{% endif %}
<div class="col-md-3"><label class="form-label">Course</label><input class="form-control" value="{{ course.code }} · {{ course.name }}" disabled></div><div class="col-md-2"><label class="form-label">Week number / order</label><input class="form-control" type="number" min="1" max="12" name="week_number" value="{{ editing_week.week_number }}" required></div><div class="col-md-7"><label class="form-label">Week title</label><input class="form-control" name="title" value="{{ editing_week.title }}" required></div>
<div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="2">{{ editing_week.description }}</textarea></div><div class="col-md-6"><label class="form-label">Learning objectives</label><textarea class="form-control" name="learning_objectives" rows="3">{{ editing_week.learning_objectives }}</textarea></div><div class="col-md-6"><label class="form-label">Topics / summary <small>(comma separated)</small></label><input class="form-control" name="topics" value="{% if editing_week %}{{ editing_week.topics|join:', ' }}{% endif %}"><label class="form-label mt-2">Release date</label><input class="form-control" type="datetime-local" name="release_date" value="{% if editing_week.release_date %}{{ editing_week.release_date|date:'Y-m-d\TH:i' }}{% endif %}"></div>
<div class="col-12"><label class="form-label">Completion requirements</label><textarea class="form-control" name="completion_requirements" rows="2">{{ editing_week.completion_requirements }}</textarea></div><div class="col-12 d-flex flex-wrap gap-3"><label><input type="checkbox" name="require_materials" {% if editing_week.require_materials %}checked{% endif %}> Materials required</label><label><input type="checkbox" name="require_quiz" {% if editing_week.require_quiz %}checked{% endif %}> Quiz required</label><label><input type="checkbox" name="require_assessment" {% if editing_week.require_assessment %}checked{% endif %}> Assignment required</label><label><input type="checkbox" name="is_published" {% if editing_week.is_published %}checked{% endif %}> Published</label><label><input type="checkbox" name="is_archived" {% if editing_week.is_archived %}checked{% endif %}> Archived</label></div><div><button class="btn btn-primary">{% if editing_week %}Save week{% else %}Create week{% endif %}</button></div></form>
