{% extends 'crp/base.html' %}
{% load socialaccount %}

{% block title %}Login - SAHE Course Registration Portal{% endblock %}

{% block content %}
<div class="login-shell">
<div class="row justify-content-center w-100">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="login-kicker mb-3">SAHE CRP · AI learning network</div>
                    <h1 class="h3 fw-bold mb-2">Welcome back</h1>
                    <p class="text-muted mb-0">Sign in to continue your learning journey.</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ request.GET.next }}">

                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>

                    <button type="submit" class="btn btn-sahe w-100">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Sign in
                    </button>
                </form>

                <div class="d-flex align-items-center gap-3 my-4" aria-hidden="true">
                    <hr class="flex-grow-1 my-0">
                    <span class="small text-muted">or</span>
                    <hr class="flex-grow-1 my-0">
                </div>

                <form method="post" action="{% provider_login_url 'google' process='login' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-dark w-100 d-flex align-items-center justify-content-center gap-2">
                        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                            <path fill="#4285F4" d="M17.64 9.205c0-.638-.057-1.252-.164-1.841H9v3.482h4.844a4.14 4.14 0 0 1-1.797 2.715v2.258h2.909c1.702-1.567 2.684-3.875 2.684-6.614z"/>
                            <path fill="#34A853" d="M9 18c2.43 0 4.468-.806 5.956-2.181l-2.909-2.258c-.806.54-1.835.859-3.047.859-2.344 0-4.328-1.585-5.037-3.714H.956v2.332A9 9 0 0 0 9 18z"/>
                            <path fill="#FBBC05" d="M3.963 10.706A5.41 5.41 0 0 1 3.681 9c0-.592.102-1.168.282-1.706V4.962H.956A9 9 0 0 0 0 9c0 1.452.347 2.827.956 4.038l3.007-2.332z"/>
                            <path fill="#EA4335" d="M9 3.58c1.321 0 2.507.454 3.441 1.346l2.581-2.581C13.464.892 11.426 0 9 0A9 9 0 0 0 .956 4.962l3.007 2.332C4.672 5.165 6.656 3.58 9 3.58z"/>
                        </svg>
                        Continue with Google
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</div>
{% endblock %}
